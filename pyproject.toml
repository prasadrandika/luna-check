[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "luna-check"
dynamic = ["version"]
description = "Find code that uses retired or retiring AI models and API features: OpenAI, Anthropic, Gemini API, Vertex AI, Azure OpenAI and Amazon Bedrock."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "prasadrandika" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["openai", "anthropic", "claude", "gemini", "vertex-ai", "azure-openai", "bedrock", "deprecation", "migration", "linter"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/prasadrandika/luna-check"

[project.scripts]
luna-check = "luna_check.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.dynamic]
version = { attr = "luna_check.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
luna_check = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
