name: luna-check
description: Find code that uses retired or retiring AI models and API features (OpenAI, Anthropic, Gemini, Vertex AI, Azure OpenAI, Bedrock).
branding:
  icon: moon
  color: blue

inputs:
  path:
    description: Folder to scan.
    default: "."
  strict:
    description: No effect since v0.2.0 (every rule runs by default). Kept so existing workflows keep working.
    default: "false"
  fail:
    description: Fail the job when high-severity problems are found.
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - shell: bash
      run: python -m pip install --quiet "$GITHUB_ACTION_PATH"
    - shell: bash
      env:
        LC_PATH: ${{ inputs.path }}
        LC_FAIL: ${{ inputs.fail }}
      run: |
        args=("$LC_PATH")
        [ "$LC_FAIL" = "true" ] || args+=(--exit-zero)
        luna-check "${args[@]}"
